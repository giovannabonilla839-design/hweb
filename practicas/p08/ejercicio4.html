
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 - Table Challenge</title>

    <style>
        td, th {
            border: 1px solid #CCC;
        }

        table {
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <h1>Ejercicio 4: Table Challenge</h1>

    <table>
        <caption>Table Challenge</caption>

        <thead>
            <tr>
                <th rowspan="2"></th>
                <th colspan="2">
                    A common header for two subheads
                </th>
                <th rowspan="2">Header 3</th>
            </tr>

            <tr>
                <th>Subhead 1</th>
                <th>Subhead 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row">Thing A</th>
                <td>Dato A1</td>
                <td>Dato A2</td>
                <td>Dato A3</td>
            </tr>

            <tr>
                <th scope="row">Thing B</th>
                <td>Dato B1</td>
                <td>Dato B2</td>
                <td>Dato B3</td>
            </tr>

            <tr>
                <th scope="row">Thing C</th>
                <td>Dato C1</td>
                <td>Dato C2</td>
                <td>Dato C3</td>
            </tr>

            <tr>
                <th scope="row">Thing D</th>
                <td>Dato D1</td>
                <td>Dato D2</td>
                <td>Dato D3</td>
            </tr>
        </tbody>

    </table>

</body>
</html>
