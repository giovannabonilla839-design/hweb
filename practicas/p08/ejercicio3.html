<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Rowspan</title>
 <style>
        td, th {
            border: 1px solid #CCC;
        }

        table {
            border: 1px solid black;
        }
         </style>
</head>

<body>

    <h1>Ejercicio 3: Combinación de filas
    </h1>
  <!-- rowspan="2" combina dos filas. -->
    <table>
        <tr>
            <th rowspan="2">Frutas</th>
            <td>Manzanas</td>
        </tr>

        <tr>
            <td>Peras</td>
        </tr>

        <tr>
            <th>Verduras</th>
            <td>Zanahorias</td>
        </tr>
    </table>

</body>
</html>
