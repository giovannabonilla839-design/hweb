<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
 <title>Ejercicio 2 - Colspan</title>
<style>
        td, th {
            border: 1px solid #CCC;
        }
 table {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Ejercicio 2: Combinación de columnas</h1>

    <table>
        <tr>
            <th colspan="3">Información general</th>
        </tr>
  <tr>
            <td>Nombre</td>
            <td>Edad</td>
            <td>Ciudad</td>
        </tr>

        <tr>
            <td>Ana</td>
            <td>20</td>
            <td>Puebla</td>
        </tr>
    </table>

</body>
</html>
